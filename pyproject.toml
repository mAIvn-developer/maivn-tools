[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.sdist]
exclude = ['.uv-cache/']
skip-excluded-dirs = true

[project]
name = 'maivn-tools'
dynamic = ['version']
description = 'Optional tool integrations for mAIvn Platform v2.'
readme = 'README.md'
requires-python = '>=3.12'
license = 'Apache-2.0'
license-files = ['LICENSE', 'NOTICE']
dependencies = [
  'maivn>=2.0.0,<3',
  'maivn-contracts>=0.1.0,<0.2',
  'openpyxl>=3.1',
  'pillow>=10',
  'pydantic>=2.13.5',
  'python-docx>=1.0',
  'python-pptx>=1.0',
  'reportlab>=4.2',
]

[project.optional-dependencies]
postgres = ['psycopg[binary]>=3.1']
pdf = ['pypdf>=6.18.1', 'reportlab>=4.2']
docx = ['python-docx>=1.0']
workbooks = ['openpyxl>=3.1']
presentations = ['python-pptx>=1.0']
html = []
all = [
  'psycopg[binary]>=3.1',
  'pypdf>=6.18.1',
  'python-docx>=1.0',
  'reportlab>=4.2',
  'openpyxl>=3.1',
  'python-pptx>=1.0',
]

[dependency-groups]
# The optional extras are development dependencies too. Without them installed
# basedpyright cannot resolve psycopg, pypdf or docx, so the Postgres connector
# and the PDF and DOCX extractors are reported as unknown types instead of being
# checked -- and the suppressions on those imports cannot be told apart from dead
# ones, because both look identical to a checker that cannot see the package.
# Verifying an optional path requires having the option installed. Constraints
# mirror the extras above.
dev = [
  'basedpyright',
  'psycopg[binary]>=3.1',
  'pypdf>=6.18.1',
  'pytest',
  'python-docx>=1.0',
  'reportlab>=4.2',
  'openpyxl>=3.1',
  'python-pptx>=1.0',
  'ruff',
]

[tool.uv.sources]
maivn = { path = '../maivn-sdk', editable = true }
maivn-contracts = { path = '../maivn-contracts', editable = true }

[tool.hatch.version]
path = 'src/maivn_tools/__version__.py'

[tool.hatch.build.targets.wheel]
packages = ['src/maivn_tools']
include = ['src/maivn_tools/py.typed']

[tool.pytest.ini_options]
addopts = [
  '--import-mode=importlib',
]
pythonpath = [
  '.',
  'src',
]
testpaths = [
  'tests',
]

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.format]
quote-style = 'single'

# LF on every platform. The default, "auto", keeps whatever ending a file
# already carries, which is how CRLF kept arriving from Windows editors.
line-ending = 'lf'

[tool.ruff.lint]
select = ['ALL']
ignore = [
  'A003',
  'ANN401',
  'COM812',
  # No source file in this repository carries a copyright header.
  'CPY001',
  'D203',
  'D213',
  'INP001',
  'ISC001',
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ['pydantic.BaseModel']

[tool.ruff.lint.per-file-ignores]
'evals/**/*.py' = [
