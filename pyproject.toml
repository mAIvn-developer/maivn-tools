[tool.basedpyright]
pythonVersion = '3.12'
typeCheckingMode = 'strict'
reportUnnecessaryTypeIgnoreComment = 'error'
# `tests` whole, not a list of its subdirectories. The list was the defect: it
# named tests/unit, tests/contract and tests/evals, so tests/auth, tests/core,
# tests/events, tests/files, tests/runtime, tests/connectors and the three files
# at the root of tests/ were never checked, and the suppressions in them
# suppressed nothing. A list omits silently; naming the directory cannot, and a
# test directory added tomorrow is checked without anyone remembering to say so.
include = [
  'src',
  'tests',
  'evals',
]
# Analyze all source, tests, and evaluations. Exclude only generated caches and
# the local virtual environment.
exclude = [
  # basedpyright replaces its default exclusions wholesale once this key is set,
  # so the caches and the virtualenv have to be named again or they get analyzed.
  '.venv',
  '.pytest_cache',
  '.ruff_cache',
  '.uv-cache',
  '.uv-cache-*',
  '.uv-python',
  '.uv-python-*',
  '**/__pycache__',
]
